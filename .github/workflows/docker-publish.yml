name: Build and Push Docker Image

# 触发:
#   - 推到 main 分支 → 发布 :latest
#   - 推 v* tag(如 v1.0.0)→ 同时发布 :latest 和 :1.0.0 / :1.0
#   - 在 Actions 页面手动触发
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch:

# 需要在 GitHub repo Settings → Secrets and variables → Actions 配置:
#   DOCKERHUB_USERNAME — 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN    — Docker Hub access token (Settings → Personal access tokens)
# 没配 secrets 时整个 workflow 会跳过(下面的 if 会判断)

jobs:
  build:
    if: ${{ vars.ENABLE_DOCKER_PUBLISH == 'true' || secrets.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lite-nav-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
