name: Build and Push Docker Image

# 触发:
#   - 推到 main 分支 → 发布 :latest
#   - 推 v* tag(如 v1.0.0)→ 同时发布 :latest 和 :1.0.0 / :1.0
#   - 在 Actions 页面手动触发
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch:

# 需要在 GitHub repo Settings → Secrets and variables → Actions 配置:
#   DOCKERHUB_USERNAME — 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN    — Docker Hub access token (需 Read & Write 权限)
# Fork 后不想推镜像?在 GitHub repo Actions → Disable workflow 即可

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建卡住 30 分钟即失败 — 防止偶发 runner/QEMU 卡死耗满 6h 上限
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets are configured
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is empty or not set."
            echo "Configure it at: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is empty or not set."
            echo "Configure it at: Settings → Secrets and variables → Actions → Repository secrets"
            echo "The token must have Read & Write permissions (Public Repo Read-only is insufficient)."
            exit 1
          fi
          echo "Both secrets are present, proceeding."

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lite-nav-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
