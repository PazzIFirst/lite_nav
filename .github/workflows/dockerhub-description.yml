name: Sync Docker Hub description

# 触发条件:改了 overview 文件 / 改了本 workflow / 手动触发
# 跟 docker-publish.yml 完全独立,改描述不会触发 build,改 backend 不会触发同步
on:
  push:
    branches: [main]
    paths:
      - 'docs/dockerhub-overview.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync description to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pazzifirst/lite-nav-backend
          short-description: "Backend for lite-nav — lunar calendar, multi-country holidays, live finance & hot lists. Multi-source fallback that never returns empty."
          readme-filepath: ./docs/dockerhub-overview.md
